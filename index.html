<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PR Monitor</title>
<style>
:root {
  --case: #1b201b; --case-2: #262c25; --case-3: #303730; --case-line: #3a4238; --case-text: #eef1ea; --case-muted: #a9b2a4;
  --ground: #e7eae2; --lane: #dce0d5; --card: #fbfcf9; --line: #c9cfc1; --line-soft: #e0e4da;
  --text: #1a1f19; --muted: #556050; --faint: #5a6556;
  --you: #f2b632; --you-ink: #2a1f05; --you-soft: #fbe9bd;
  --them: #3f6f34; --them-soft: #d5e3cb; --them-ink: #21401a;
  --flag: #c23b2a; --flag-soft: #f6dcd6;
  --ok: #2f7a3b; --bad: #b3372a; --warn: #8a5e00;
  --shadow: 0 1px 2px rgba(20, 28, 18, .07), 0 2px 8px rgba(20, 28, 18, .05);
  --shadow-lg: 0 8px 32px rgba(15, 20, 14, .18), 0 2px 6px rgba(15, 20, 14, .08);
  --r: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --case: #0b0d0b; --case-2: #1a1e19; --case-3: #232822; --case-line: #2c3329; --case-text: #e8ece3; --case-muted: #9aa494;
    --ground: #20251f; --lane: #272d26; --card: #2e352d; --line: #343c32; --line-soft: #2a3128;
    --text: #e4e8df; --muted: #a3ac9d; --faint: #9aa394;
    --you: #f2b632; --you-ink: #231904; --you-soft: #3b3115;
    --them: #86b977; --them-soft: #263a21; --them-ink: #c4e2b7;
    --flag: #d9483a; --flag-soft: #3c201b;
    --ok: #7cc585; --bad: #f08070; --warn: #e2b54a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, .55);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; caret-color: var(--you); }
::selection { background: var(--you-soft); color: var(--text); }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
.num, time, .t { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 14px; height: 14px; }
.ic.lg { width: 20px; height: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--case); border-color: var(--case); color: var(--case-text); }
.btn.primary:hover { background: var(--case-3); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--line-soft); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.case .btn { background: transparent; border-color: var(--case-line); color: var(--case-text); }
.case .btn:hover { background: var(--case-2); border-color: var(--case-muted); }
.spinning .ic { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Header + Your move rail (the clock case) */
.case { background: var(--case); color: var(--case-text); border-bottom: 1px solid var(--case-line); }
.bar { display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 20px; }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.brand .ic { width: 22px; height: 22px; color: var(--you); }
.status { color: var(--case-muted); font-size: 12px; }
.demo-pill { font-size: 12px; color: var(--you); border: 1px solid color-mix(in srgb, var(--you) 45%, transparent); border-radius: 999px; padding: 2px 10px; }
.bar .spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 8px; color: var(--case-muted); font-size: 13px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--case-3); display: block; }

.rail { padding: 6px 20px 20px; }
.rail-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.move-n { font-size: 40px; line-height: 1; font-weight: 600; color: var(--you); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.move-n.zero { color: var(--case-muted); }
.move-l { font-size: 15px; font-weight: 600; }
.move-sub { color: var(--case-muted); font-size: 13px; }
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 2px; }
.tile { scroll-snap-align: start; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 10px 10px 12px; border-radius: var(--r); background: var(--case-2); border: 1px solid var(--case-line); color: var(--case-text); cursor: pointer; min-width: 0; transition: border-color .15s, background .15s; }
.tile:hover { border-color: var(--case-muted); background: var(--case-3); }
.tile[aria-current="true"] { border-color: var(--you); }
.tile-main { display: grid; gap: 2px; min-width: 0; flex: 1; }
.tile .ref { font-size: 12px; color: var(--case-muted); }
.tile-title { font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.verb { font-size: 12px; color: var(--you); font-weight: 500; }
.tile-clock { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 4px; background: var(--you); color: var(--you-ink); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile-clock.danger { background: var(--flag); color: #fff; }
.tile-clock.danger .ic { fill: currentColor; }
.tile-more { color: var(--case-muted); font-size: 13px; align-self: center; padding: 0 4px; background: none; border: none; cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.rail-empty { color: var(--case-muted); font-size: 14px; padding: 4px 0 2px; }

/* Notices */
.notice { display: flex; gap: 8px; align-items: flex-start; margin: 16px 20px 0; padding: 10px 12px; border-radius: var(--r); font-size: 13px; background: var(--flag-soft); color: var(--bad); }
.notice.warn { background: var(--you-soft); color: var(--warn); }
.notice .ic { margin-top: 1px; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 16px 20px 12px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--lane); border: 1px solid var(--line-soft); }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 5px; background: transparent; cursor: pointer; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.seg .num { color: var(--faint); font-size: 12px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 500; color: var(--muted); }
.toggle[aria-pressed="true"] { border-color: var(--flag); color: var(--flag); background: var(--flag-soft); }
.toggle[aria-pressed="true"] .ic { fill: currentColor; }
.toolbar .spacer { flex: 1; }
.field { height: 32px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); padding: 0 10px; min-width: 0; }
.field:hover { border-color: var(--faint); }
.search { position: relative; display: inline-flex; align-items: center; }
.search .ic { position: absolute; left: 9px; color: var(--faint); pointer-events: none; }
.search input { padding-left: 30px; width: 220px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--them); width: 15px; height: 15px; margin: 0; }

/* Board */
.board-wrap { overflow-x: auto; padding: 0 20px 32px; scroll-snap-type: x proximity; scroll-padding-inline: 20px; }
.board { display: grid; gap: 0 8px; min-width: min-content; }
.lane-head { position: sticky; top: 0; z-index: 2; background: var(--ground); padding-top: 4px; scroll-snap-align: start; }
.lane-head .inner { background: var(--lane); border-radius: var(--r) var(--r) 0 0; padding: 10px 12px 8px; }
.lane-head .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; font-size: 13px; }
.lane-head .t .num { color: var(--faint); font-weight: 500; }
.lane-head .d { font-size: 12px; color: var(--faint); }
.swim-head { grid-column: 1 / -1; padding: 20px 0 8px; }
.swim-head span { position: sticky; left: 0; font-weight: 600; font-size: 14px; }
.swim-head .num { color: var(--faint); font-weight: 500; margin-left: 6px; }
.cell { background: var(--lane); padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 8px; min-height: 64px; border-radius: 0 0 var(--r) var(--r); }
.swim-head + .cell, .swim-head ~ .cell { border-radius: var(--r); }
.cell-empty { color: var(--faint); font-size: 12px; text-align: center; padding: 18px 0; }

/* Card */
.card { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px 10px; display: grid; gap: 8px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--line); }
.card[aria-current="true"] { border-color: var(--them); box-shadow: 0 0 0 1px var(--them), var(--shadow); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); min-width: 0; }
.ref { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref b { font-weight: 500; color: var(--muted); margin-left: 4px; }
.by { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.by img { width: 16px; height: 16px; border-radius: 50%; }
.card-title { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--faint); }
.meta > span { display: inline-flex; align-items: center; gap: 4px; }
.meta .ok { color: var(--ok); } .meta .bad, .bad { color: var(--bad); } .meta .warn { color: var(--warn); }
.add { color: var(--ok); } .del { color: var(--bad); }
.rvs { margin-left: auto; display: inline-flex; align-items: center; }
.rv { position: relative; display: inline-flex; margin-left: -4px; }
.rv:first-child { margin-left: 0; }
.rv img { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--card); background: var(--lane); display: block; }
.rv .st { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--card); }
.rv .st .ic { width: 8px; height: 8px; stroke-width: 3; }
.st.APPROVED { background: var(--ok); color: #fff; }
.st.CHANGES_REQUESTED { background: var(--bad); color: #fff; }
.st.COMMENTED, .st.DISMISSED { background: var(--faint); color: #fff; }
.st.PENDING { background: var(--card); border-color: var(--warn) !important; }
.team { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 1px 6px; margin-left: 4px; }

/* The chess clock */
.clock { display: flex; height: 30px; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; font-size: 12px; background: var(--card); }
.clock .face { flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 8px; min-width: 0; color: var(--faint); transition: background .2s, color .2s; }
.clock .face.you { flex-shrink: 0; }
.clock .face + .face { border-left: 1px solid var(--line); }
.clock .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clock .t { flex: none; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.clock .face.lit.you { background: var(--you); color: var(--you-ink); }
.clock .face.lit.them { background: var(--them-soft); color: var(--them-ink); }
.clock .face.lit .who { font-weight: 500; }
.clock .face.lit.warn .t .ic { color: currentColor; }
.clock .face.lit.danger { background: var(--flag); color: #fff; }
.clock .face.lit.danger .t .ic { fill: currentColor; }
.clock.stopped { background: transparent; border-style: dashed; }
.clock.stopped .face { justify-content: flex-start; }
.clock.stopped .face .t { margin-left: auto; font-weight: 500; font-size: 12px; }
.clock.lg { height: 44px; font-size: 13px; }
.clock.lg .t { font-size: 18px; }
.clock.lg .face { padding: 0 12px; }

/* Skeleton */
.sk { background: var(--card); border-radius: var(--r); height: 108px; border: 1px solid var(--line-soft); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

/* Inspector */
.inspector { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); z-index: 20; overflow-y: auto; transform: translateX(100%); visibility: hidden; transition: transform .22s cubic-bezier(.16, 1, .3, 1), visibility 0s .22s; }
.inspector.open { transform: none; visibility: visible; transition: transform .22s cubic-bezier(.16, 1, .3, 1); }
@media (min-width: 1200px) { body.inspecting main { padding-right: 440px; } }
.insp-head { position: sticky; top: 0; background: var(--card); padding: 14px 16px 12px; border-bottom: 1px solid var(--line-soft); display: grid; gap: 6px; z-index: 1; }
.insp-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--faint); }
.insp-title { font-size: 17px; line-height: 1.3; }
.insp-title a { text-decoration: none; }
.insp-title a:hover { text-decoration: underline; }
.insp-body { padding: 14px 16px 24px; display: grid; gap: 20px; }
.insp-body h4 { font-size: 13px; margin-bottom: 8px; display: flex; gap: 6px; align-items: baseline; }
.insp-body h4 .num { color: var(--faint); font-weight: 500; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts code { font: 12px var(--mono); background: var(--lane); padding: 1px 5px; border-radius: 4px; }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: var(--r); overflow: hidden; }
.list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--card); font-size: 13px; }
.list li .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.list img { width: 24px; height: 24px; border-radius: 50%; flex: none; }
.list .sub { color: var(--faint); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.list .body { color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.list code { font: 12px var(--mono); color: var(--muted); }
.list a { color: var(--them); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--lane); color: var(--muted); }
.pill.on-author { background: var(--you-soft); color: var(--warn); }
.pill.on-reviewer { background: var(--them-soft); color: var(--them-ink); }
.none { color: var(--faint); font-size: 13px; }
.state-line { display: inline-flex; align-items: center; gap: 5px; }

/* Welcome */
.welcome { max-width: 560px; margin: 48px auto; padding: 0 20px; }
.welcome h2 { font-size: 22px; letter-spacing: -.01em; margin-bottom: 8px; }
.welcome p { color: var(--muted); margin: 0 0 12px; max-width: 65ch; }
.welcome-clock { max-width: 320px; margin: 4px 0 8px; }
.welcome ol { color: var(--muted); padding-left: 20px; margin: 0 0 20px; display: grid; gap: 6px; }
.welcome .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.empty-all { text-align: center; color: var(--muted); padding: 48px 20px; }

/* Settings dialog */
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--card); color: var(--text); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: rgba(14, 17, 14, .45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
.dlg-head h3 { font-size: 16px; }
.form { display: grid; gap: 16px; padding: 16px; }
.form label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
.form .field { height: 36px; font-weight: 400; }
.form .hint { color: var(--faint); font-size: 12px; font-weight: 400; }
.form .hint a { color: var(--them); }
.form .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.form .check { font-size: 13px; font-weight: 400; color: var(--text); display: flex; align-items: flex-start; }
.form .check input { margin-top: 2px; }
.dlg-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
.dlg-foot .spacer { flex: 1; }

@media (max-width: 720px) {
  .bar { padding: 0 12px; gap: 10px; }
  .status, .me span, #demoPill { display: none; }
  .rail { padding: 4px 12px 16px; }
  .tiles { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: 1fr; overflow: visible; }
  .toolbar { padding: 12px 12px 8px; }
  .search, .search input { width: 100%; }
  .toolbar .spacer { display: none; }
  .board-wrap { padding: 0 12px 24px; scroll-padding-inline: 12px; }
  .notice { margin: 12px 12px 0; }
  .form .row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>

<script>
'use strict';

/* ---------- Config ---------- */

const LANES = [
  { id: 'draft',    title: 'Draft',             desc: 'Not ready for review' },
  { id: 'waiting',  title: 'Awaiting review',   desc: 'No review yet' },
  { id: 'changes',  title: 'Changes requested', desc: 'Feedback not addressed yet' },
  { id: 'updated',  title: 'Updated',           desc: 'Author responded' },
  { id: 'approved', title: 'Approved',          desc: 'Ready to merge' },
  { id: 'done',     title: 'Done',              desc: 'Merged or closed recently' },
];
const SWIMLANES = [
  { id: 'mine',   title: 'My PRs' },
  { id: 'review', title: 'Reviewing' },
];
const DEFAULTS = {
  token: '', extraQuery: '', warnHours: 24, dangerHours: 72, doneDays: 7, refreshMin: 5,
  includeAssigned: true, ignoreBots: true, notify: false,
};
const SETTINGS_KEY = 'prmonitor.settings.v1';
const UI_KEY = 'prmonitor.ui.v1';
const H = 3600e3;

/* ---------- State ---------- */

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let settings = { ...DEFAULTS, ...store.get(SETTINGS_KEY, {}) };
let ui = { role: 'all', repo: '', q: '', flagged: false, swim: true, ...store.get(UI_KEY, {}) };
let state = { me: null, prs: [], loading: false, error: null, warnings: [], demo: false, fetchedAt: null, rate: null };
let knownTurnIds = null;
let refreshTimer = null;

/* ---------- Helpers ---------- */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ts = (s) => (s ? Date.parse(s) || 0 : 0);
const eq = (a, b) => !!a && !!b && a.toLowerCase() === b.toLowerCase();
const maxOf = (arr) => arr.reduce((m, x) => (x > m ? x : m), 0);

function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const m = Math.floor(ms / 60000);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h`;
  const d = Math.floor(h / 24), rh = h % 24;
  return rh && d < 7 ? `${d}d ${rh}h` : `${d}d`;
}
const ago = (t) => (t ? `${fmtDur(Date.now() - t)} ago` : '—');
const fmtDate = (t) => (t ? new Date(t).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : '—');

function staleLevel(ms) {
  const h = ms / H;
  if (h >= settings.dangerHours) return 'danger';
  if (h >= settings.warnHours) return 'warn';
  return '';
}
const isBotActor = (a) => !!a && (a.__typename === 'Bot' || /\[bot\]$/i.test(a.login || ''));

/* ---------- GitHub API ---------- */

const PR_FRAGMENT = `
fragment PRF on PullRequest {
  id number title url isDraft state merged mergedAt closedAt createdAt updatedAt
  additions deletions changedFiles mergeable reviewDecision headRefName baseRefName
  author { __typename login avatarUrl }
  repository { nameWithOwner }
  reviewRequests(first: 20) { nodes { requestedReviewer {
    __typename
    ... on User { login avatarUrl }
    ... on Bot { login avatarUrl }
    ... on Mannequin { login avatarUrl }
    ... on Team { name slug }
  } } }
  reviews(last: 60) { nodes { state submittedAt author { __typename login avatarUrl } } }
  reviewThreads(first: 60) { totalCount nodes {
    isResolved isOutdated path
    firstComment: comments(first: 1) { totalCount nodes { author { __typename login avatarUrl } bodyText createdAt url } }
    lastComment: comments(last: 1) { nodes { author { __typename login } createdAt } }
  } }
  comments { totalCount }
  commits(last: 1) { totalCount nodes { commit { committedDate statusCheckRollup { state } } } }
  timelineItems(last: 40, itemTypes: [PULL_REQUEST_COMMIT, HEAD_REF_FORCE_PUSHED_EVENT, REVIEW_REQUESTED_EVENT, READY_FOR_REVIEW_EVENT]) {
    nodes {
      __typename
      ... on PullRequestCommit { commit { committedDate } }
      ... on HeadRefForcePushedEvent { createdAt }
      ... on ReadyForReviewEvent { createdAt }
      ... on ReviewRequestedEvent { createdAt requestedReviewer { __typename ... on User { login } ... on Team { slug } } }
    }
  }
}`;
const SEARCH_QUERY = `
query($q: String!, $after: String) {
  search(query: $q, type: ISSUE, first: 25, after: $after) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes { ...PRF }
  }
  rateLimit { remaining limit resetAt }
}` + PR_FRAGMENT;

async function gql(query, variables) {
  const res = await fetch('https://api.github.com/graphql', {
    method: 'POST',
    headers: { Authorization: `bearer ${settings.token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, variables }),
  });
  if (res.status === 401) throw new Error('Invalid or expired token (401). Check it in Settings.');
  if (res.status === 403) throw new Error('GitHub refused the request (403). You may be rate-limited or the token lacks access.');
  if (!res.ok) throw new Error(`GitHub API error ${res.status}`);
  const j = await res.json();
  if (j.errors?.length) {
    const msgs = [...new Set(j.errors.map((e) => e.message))];
    if (!j.data) throw new Error(msgs.join('; '));
    state.warnings.push(...msgs);
  }
  return j.data;
}

function buildSearches(me) {
  const extra = settings.extraQuery.trim();
  const base = `is:pr archived:false ${extra}`.trim();
  const since = new Date(Date.now() - settings.doneDays * 24 * H).toISOString().slice(0, 10);
  const list = [
    { key: 'authored',  q: `${base} is:open author:${me}` },
    { key: 'requested', q: `${base} is:open review-requested:${me}` },
    { key: 'reviewed',  q: `${base} is:open reviewed-by:${me} -author:${me}` },
  ];
  if (settings.includeAssigned) list.push({ key: 'assigned', q: `${base} is:open assignee:${me} -author:${me}` });
  if (settings.doneDays > 0) {
    list.push({ key: 'done', q: `${base} is:closed author:${me} closed:>=${since}` });
    list.push({ key: 'done', q: `${base} is:closed reviewed-by:${me} -author:${me} closed:>=${since}` });
  }
  return list;
}

async function searchAll(q, maxPages = 4) {
  const out = [];
  let after = null;
  for (let i = 0; i < maxPages; i++) {
    const data = await gql(SEARCH_QUERY, { q, after });
    state.rate = data.rateLimit;
    out.push(...(data.search.nodes || []).filter((n) => n && n.id));
    if (!data.search.pageInfo.hasNextPage) break;
    after = data.search.pageInfo.endCursor;
  }
  return out;
}

async function fetchFromGitHub() {
  if (!state.me) {
    const d = await gql('query { viewer { login avatarUrl } }');
    state.me = d.viewer;
  }
  const me = state.me.login;
  const results = await Promise.all(buildSearches(me).map(async (s) => ({ key: s.key, nodes: await searchAll(s.q) })));
  return collect(results);
}

function collect(results) {
  const byId = new Map();
  for (const { key, nodes } of results) {
    for (const n of nodes) {
      const e = byId.get(n.id) || { node: n, src: new Set() };
      e.src.add(key);
      byId.set(n.id, e);
    }
  }
  return [...byId.values()];
}

/* ---------- Classification ---------- */

function analyze(n, me, src) {
  const ignore = (a) => settings.ignoreBots && isBotActor(a);
  const author = n.author?.login || 'ghost';
  const isMine = eq(author, me);

  // Timeline: last push, ready-for-review, review requests
  let lastPushAt = ts(n.commits?.nodes?.[0]?.commit?.committedDate);
  let readyAt = ts(n.createdAt), lastRequestAt = 0, myRequestAt = 0, teamRequestAt = 0;
  for (const it of n.timelineItems?.nodes || []) {
    if (!it) continue;
    if (it.__typename === 'PullRequestCommit') lastPushAt = Math.max(lastPushAt, ts(it.commit?.committedDate));
    else if (it.__typename === 'HeadRefForcePushedEvent') lastPushAt = Math.max(lastPushAt, ts(it.createdAt));
    else if (it.__typename === 'ReadyForReviewEvent') readyAt = Math.max(readyAt, ts(it.createdAt));
    else if (it.__typename === 'ReviewRequestedEvent') {
      const t = ts(it.createdAt), r = it.requestedReviewer;
      lastRequestAt = Math.max(lastRequestAt, t);
      if (r && eq(r.login, me)) myRequestAt = Math.max(myRequestAt, t);
      if (r && r.__typename === 'Team') teamRequestAt = Math.max(teamRequestAt, t);
    }
  }

  // Reviewers: latest state per person (COMMENTED doesn't override APPROVED / CHANGES_REQUESTED)
  const reviewers = new Map();
  let lastFeedbackAt = 0, lastApprovalAt = 0;
  const reviews = (n.reviews?.nodes || [])
    .filter((r) => r && r.author && r.submittedAt && r.state !== 'PENDING')
    .sort((a, b) => ts(a.submittedAt) - ts(b.submittedAt));
  for (const r of reviews) {
    if (eq(r.author.login, author)) continue; // author's thread replies show up as reviews
    const t = ts(r.submittedAt);
    const e = reviewers.get(r.author.login) || { login: r.author.login, avatar: r.author.avatarUrl, state: null, lastAt: 0, bot: isBotActor(r.author), pending: false };
    e.lastAt = Math.max(e.lastAt, t);
    if (r.state === 'COMMENTED') { if (!e.state || e.state === 'DISMISSED') e.state = 'COMMENTED'; }
    else e.state = r.state;
    reviewers.set(r.author.login, e);
    if (ignore(r.author)) continue;
    if (r.state === 'APPROVED') lastApprovalAt = Math.max(lastApprovalAt, t);
    else if (r.state !== 'DISMISSED') lastFeedbackAt = Math.max(lastFeedbackAt, t);
  }
  const teams = [];
  for (const rr of n.reviewRequests?.nodes || []) {
    const r = rr?.requestedReviewer;
    if (!r) continue;
    if (r.__typename === 'Team') { teams.push(r.slug || r.name); continue; }
    const e = reviewers.get(r.login) || { login: r.login, avatar: r.avatarUrl, state: null, lastAt: 0, bot: isBotActor(r) };
    e.pending = true;
    reviewers.set(r.login, e);
  }
  const requestedMe = src.has('requested') || [...reviewers.values()].some((r) => r.pending && eq(r.login, me));

  // Review threads
  const threads = (n.reviewThreads?.nodes || []).filter(Boolean).map((t) => {
    const f = t.firstComment?.nodes?.[0], l = t.lastComment?.nodes?.[0];
    return {
      resolved: t.isResolved, outdated: t.isOutdated, path: t.path,
      starter: f?.author?.login, starterAvatar: f?.author?.avatarUrl, starterBot: isBotActor(f?.author),
      body: f?.bodyText || '', url: f?.url, createdAt: ts(f?.createdAt),
      lastBy: l?.author?.login, lastAt: ts(l?.createdAt), count: t.firstComment?.totalCount || 0,
    };
  });
  const counted = threads.filter((t) => !(settings.ignoreBots && t.starterBot));
  const unresolved = counted.filter((t) => !t.resolved);
  const awaitingAuthor = unresolved.filter((t) => !eq(t.lastBy, author));
  const authorReplied = unresolved.filter((t) => eq(t.lastBy, author));
  const lastAuthorReplyAt = maxOf(authorReplied.map((t) => t.lastAt));

  // Overall lane (author's point of view)
  const human = [...reviewers.values()].filter((r) => !(settings.ignoreBots && r.bot));
  const anyChanges = human.some((r) => r.state === 'CHANGES_REQUESTED') || n.reviewDecision === 'CHANGES_REQUESTED';
  const anyApproved = human.some((r) => r.state === 'APPROVED');
  const pendingHumans = human.some((r) => r.pending) || teams.length > 0;
  const approved = n.reviewDecision === 'APPROVED' || (!n.reviewDecision && anyApproved && !anyChanges && !pendingHumans);
  const needsFix = anyChanges || awaitingAuthor.length > 0;
  const authorActedAt = Math.max(lastPushAt, lastAuthorReplyAt, lastRequestAt);

  let lane, turn, since, hint = '';
  if (n.state !== 'OPEN') {
    lane = 'done'; turn = 'none'; since = ts(n.mergedAt || n.closedAt);
  } else if (n.isDraft) {
    lane = 'draft'; turn = 'draft'; since = ts(n.createdAt);
  } else if (approved && awaitingAuthor.length === 0) {
    lane = 'approved'; turn = 'author'; since = lastApprovalAt || ts(n.updatedAt); hint = 'ready to merge';
  } else if (needsFix) {
    if (authorActedAt > lastFeedbackAt) { lane = 'updated'; turn = 'reviewers'; since = authorActedAt; }
    else { lane = 'changes'; turn = 'author'; since = lastFeedbackAt; hint = 'address review feedback'; }
  } else if (lastFeedbackAt && authorActedAt > lastFeedbackAt) {
    lane = 'updated'; turn = 'reviewers'; since = authorActedAt;
  } else {
    lane = 'waiting'; turn = 'reviewers'; since = Math.max(readyAt, lastRequestAt);
  }

  // Reviewer's point of view: is the ball in my court?
  if (!isMine && n.state === 'OPEN' && !n.isDraft) {
    const my = [...reviewers.values()].find((r) => eq(r.login, me) && r.lastAt);
    const myUnresolved = unresolved.filter((t) => eq(t.starter, me));
    if (requestedMe) {
      lane = my ? 'updated' : 'waiting'; turn = 'me';
      since = myRequestAt || teamRequestAt || readyAt;
      hint = my ? 're-review requested' : 'review requested';
    } else if (my) {
      if (my.state === 'APPROVED') {
        if (turn === 'reviewers') turn = 'others';
        hint = 'you approved';
      } else if (my.state === 'CHANGES_REQUESTED' || myUnresolved.length) {
        const updated = lastPushAt > my.lastAt || myUnresolved.some((t) => eq(t.lastBy, author) && t.lastAt > my.lastAt);
        if (updated) { lane = 'updated'; turn = 'me'; since = Math.max(lastPushAt, lastAuthorReplyAt); hint = 'author updated, re-review'; }
        else { lane = 'changes'; turn = 'author'; since = my.lastAt; hint = 'to address your review'; }
      } else if (turn === 'reviewers') {
        turn = 'me'; hint = 'you commented but have not approved';
      }
    } else if (turn === 'reviewers') {
      turn = 'me'; hint = src.has('assigned') ? 'assigned to you' : 'waiting for your review';
    }
  } else if (isMine && turn === 'author') {
    turn = 'me';
  }

  const rollup = n.commits?.nodes?.[0]?.commit?.statusCheckRollup?.state || null;
  return {
    id: n.id, number: n.number, title: n.title, url: n.url, repo: n.repository?.nameWithOwner || '',
    author, authorAvatar: n.author?.avatarUrl, isMine, role: isMine ? 'mine' : 'review',
    lane, turn, since, hint, state: n.merged ? 'MERGED' : n.state, isDraft: n.isDraft,
    createdAt: ts(n.createdAt), updatedAt: ts(n.updatedAt), closedAt: ts(n.mergedAt || n.closedAt), readyAt,
    lastPushAt, lastFeedbackAt, lastApprovalAt, commits: n.commits?.totalCount || 0,
    additions: n.additions, deletions: n.deletions, changedFiles: n.changedFiles,
    mergeable: n.mergeable, ci: rollup, reviewDecision: n.reviewDecision,
    head: n.headRefName, base: n.baseRefName, comments: n.comments?.totalCount || 0,
    reviewers: [...reviewers.values()].sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0)), teams,
    threads, counted: counted.length, unresolved: unresolved.length,
    awaitingAuthor: awaitingAuthor.length, authorReplied: authorReplied.length, requestedMe,
  };
}


/* ---------- Rendering ---------- */

const STATE_TEXT = { APPROVED: 'Approved', CHANGES_REQUESTED: 'Requested changes', COMMENTED: 'Commented', DISMISSED: 'Review dismissed' };
const STATE_ICON = { APPROVED: 'check', CHANGES_REQUESTED: 'x', COMMENTED: 'comment', DISMISSED: 'x' };
const CI = {
  SUCCESS: ['check', 'ok', 'Checks passed'], FAILURE: ['x', 'bad', 'Checks failed'], ERROR: ['x', 'bad', 'Checks errored'],
  PENDING: ['dot', 'warn', 'Checks running'], EXPECTED: ['dot', 'warn', 'Checks pending'],
};
let selectedId = null;
let showAllTiles = false;

const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const pad2 = (n) => String(n).padStart(2, '0');
function fmtClock(ms) {
  const m = Math.max(0, Math.floor(ms / 60000));
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ${pad2(m % 60)}m`;
  return `${Math.floor(h / 24)}d ${pad2(h % 24)}h`;
}
const waitOf = (p) => Date.now() - p.since;
const isOpen = (p) => p.lane !== 'done';
const isFlagged = (p) => isOpen(p) && p.lane !== 'draft' && staleLevel(waitOf(p)) === 'danger';
const shortRepo = (r) => r.split('/').pop();
function avatarImg(src, login, cls = '') {
  return `<img class="${cls}" src="${esc(src || '')}" alt="" title="${esc(login)}" loading="lazy" onerror="this.style.visibility='hidden'">`;
}

function verbFor(p) {
  if (p.isMine) return p.lane === 'approved' ? 'Merge' : 'Address feedback';
  if (p.lane === 'updated') return 'Re-review';
  if (/commented/.test(p.hint)) return 'Approve or follow up';
  return 'Review';
}
function themLabel(p) {
  if (!p.isMine) return p.turn === 'others' ? 'Others' : `@${p.author}`;
  const pending = p.reviewers.filter((r) => r.pending && !(settings.ignoreBots && r.bot));
  if (pending.length === 1 && !p.teams.length) return `@${pending[0].login}`;
  if (!pending.length && p.teams.length === 1) return `@${p.teams[0]}`;
  return 'Reviewers';
}
function turnSentence(p) {
  if (p.lane === 'done') return p.state === 'MERGED' ? 'Merged' : 'Closed';
  if (p.lane === 'draft') return p.isMine ? 'Your draft' : `@${p.author} is still drafting`;
  if (p.turn === 'me') return `Your move: ${verbFor(p).toLowerCase()}`;
  if (p.turn === 'others') return 'You approved; waiting on other reviewers';
  if (p.turn === 'author') return `Waiting on @${p.author} to address ${p.isMine ? 'feedback' : 'your review'}`;
  return `Waiting on ${themLabel(p)}`;
}

function clockHTML(p, size = '') {
  if (p.lane === 'done') {
    return `<div class="clock stopped ${size}"><span class="face">${ic(p.state === 'MERGED' ? 'merge' : 'closed', 'sm')}<span class="who">${p.state === 'MERGED' ? 'Merged' : 'Closed'}</span><span class="t">${ago(p.closedAt)}</span></span></div>`;
  }
  if (p.lane === 'draft') {
    return `<div class="clock stopped ${size}"><span class="face">${ic('draft', 'sm')}<span class="who">Draft</span><span class="t" title="Opened ${esc(fmtDate(p.createdAt))}">${fmtDur(Date.now() - p.createdAt)} old</span></span></div>`;
  }
  const lit = p.turn === 'me' ? 'you' : 'them';
  const lvl = staleLevel(waitOf(p));
  const them = themLabel(p);
  const flag = lvl ? ic('flag', 'sm') : '';
  const face = (side, label) => {
    const on = side === lit;
    return `<span class="face ${side}${on ? ` lit ${lvl}` : ''}"><span class="who">${esc(label)}</span>${on ? `<span class="t">${flag}${fmtClock(waitOf(p))}</span>` : ''}</span>`;
  };
  const aria = `${lit === 'you' ? 'Your move' : `Waiting on ${them}`} for ${fmtDur(waitOf(p))}${lvl === 'danger' ? ', overdue' : ''}`;
  return `<div class="clock ${size}" role="img" aria-label="${esc(aria)}">${face('you', 'You')}${face('them', them)}</div>`;
}

function reviewerAvatars(p) {
  const out = p.reviewers.slice(0, 5).map((r) => {
    const st = r.pending ? 'PENDING' : r.state;
    const label = `${r.login}: ${r.pending ? 'review requested' : STATE_TEXT[r.state] || ''}${r.bot ? ' (bot)' : ''}`;
    const badge = st === 'PENDING' ? '' : ic(STATE_ICON[st] || 'dot');
    return `<span class="rv" title="${esc(label)}">${avatarImg(r.avatar, label)}<span class="st ${st}">${badge}</span></span>`;
  });
  if (p.reviewers.length > 5) out.push(`<span class="team">+${p.reviewers.length - 5}</span>`);
  out.push(...p.teams.map((t) => `<span class="team" title="Review requested from team ${esc(t)}">@${esc(t)}</span>`));
  return out.join('');
}

function metaHTML(p) {
  const m = [];
  if (p.counted) {
    const done = p.counted - p.unresolved;
    m.push(`<span class="${p.unresolved ? '' : 'ok'}" title="${done} of ${p.counted} review threads resolved">${ic('comment', 'sm')}${done}/${p.counted}</span>`);
  }
  if (p.ci && CI[p.ci]) { const [i, c, t] = CI[p.ci]; m.push(`<span class="${c}" title="${t}">${ic(i, 'sm')}CI</span>`); }
  if (p.mergeable === 'CONFLICTING' && isOpen(p)) m.push(`<span class="bad" title="Merge conflict">${ic('alert', 'sm')}Conflict</span>`);
  m.push(`<span class="num" title="Lines changed"><span class="add">+${p.additions ?? 0}</span><span class="del">−${p.deletions ?? 0}</span></span>`);
  return m.join('');
}

function cardHTML(p) {
  return `<article class="card" data-id="${esc(p.id)}" tabindex="0" aria-current="${p.id === selectedId}" aria-label="${esc(`${p.repo} #${p.number}: ${p.title}. ${turnSentence(p)}`)}">
    <div class="card-top"><span class="ref" title="${esc(p.repo)}">${esc(shortRepo(p.repo))}<b>#${p.number}</b></span>
      ${p.isMine ? '' : `<span class="by">${avatarImg(p.authorAvatar, p.author)}@${esc(p.author)}</span>`}</div>
    <h3 class="card-title">${esc(p.title)}</h3>
    ${clockHTML(p)}
    <div class="meta">${metaHTML(p)}<span class="rvs">${reviewerAvatars(p)}</span></div>
  </article>`;
}

function sortCards(a, b) {
  const ta = a.turn === 'me' ? 0 : 1, tb = b.turn === 'me' ? 0 : 1;
  if (ta !== tb) return ta - tb;
  if (a.lane === 'done') return b.closedAt - a.closedAt;
  return a.since - b.since; // longest wait first
}

function filtered() {
  const q = ui.q.trim().toLowerCase();
  return state.prs.filter((p) => {
    if (ui.role !== 'all' && p.role !== ui.role) return false;
    if (ui.repo && p.repo !== ui.repo) return false;
    if (ui.flagged && !isFlagged(p)) return false;
    if (q) {
      const hay = `${p.title} #${p.number} ${p.repo} ${p.author} ${p.reviewers.map((r) => r.login).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  renderHeader();
  renderNotices();
  const board = $('#board'), rail = $('#rail'), toolbar = $('#toolbar');
  if (!settings.token && !state.demo) {
    rail.hidden = true; toolbar.hidden = true; $('#btnRefresh').hidden = true;
    board.innerHTML = `<section class="welcome">
      <h2>See whose move it is on every pull request</h2>
      <p>PR Monitor lists the GitHub pull requests you opened or were asked to review, sorts them by review state, and runs a clock on whoever needs to act next.</p>
      <div class="clock welcome-clock" role="img" aria-label="Example: waiting on @alice for 2 days, overdue"><span class="face you"><span class="who">You</span></span><span class="face them lit danger"><span class="who">@alice</span><span class="t">${ic('flag', 'sm')}2d 04h</span></span></div>
      <p>The lit side is whoever needs to act. When a wait passes your threshold, the flag falls.</p>
      <ol>
        <li><a href="https://github.com/settings/tokens/new?scopes=repo&description=PR%20Monitor" target="_blank" rel="noopener">Create a classic token</a> with the <code>repo</code> scope.</li>
        <li>Paste it in Settings. It stays in this browser.</li>
      </ol>
      <div class="actions"><button class="btn primary" data-act="settings">Add token</button><button class="btn" data-act="demo">Try with demo data</button></div>
    </section>`;
    renderInspector();
    return;
  }
  toolbar.hidden = false;
  $('#btnRefresh').hidden = false;
  renderRail();
  renderToolbar();

  if (!state.prs.length && state.loading) {
    board.innerHTML = boardHTML(LANES, [{ id: 'sk', title: null, prs: [] }], true);
    return;
  }
  if (!state.prs.length && !state.error) {
    board.innerHTML = '<div class="empty-all">No open pull requests involve you right now.</div>';
    renderInspector();
    return;
  }
  const prs = filtered();
  const lanes = LANES.filter((l) => l.id !== 'done' || settings.doneDays > 0 || state.demo);
  const rows = ui.swim
    ? SWIMLANES.filter((s) => ui.role === 'all' || ui.role === s.id).map((s) => ({ ...s, prs: prs.filter((p) => p.role === s.id) }))
    : [{ id: 'all', title: null, prs }];
  board.innerHTML = boardHTML(lanes, rows, false, prs);
  renderInspector();
}

function boardHTML(lanes, rows, skeleton, prs = []) {
  let html = `<div class="board-wrap"><div class="board" style="grid-template-columns: repeat(${lanes.length}, minmax(212px, 1fr))">`;
  for (const l of lanes) {
    const n = prs.filter((p) => p.lane === l.id).length;
    html += `<div class="lane-head"><div class="inner"><div class="t"><span>${l.title}</span><span class="num">${skeleton ? '' : n}</span></div><div class="d">${l.desc}</div></div></div>`;
  }
  for (const row of rows) {
    if (row.title) html += `<div class="swim-head"><span>${row.title}<span class="num">${row.prs.filter(isOpen).length} open</span></span></div>`;
    for (const l of lanes) {
      if (skeleton) { html += `<div class="cell"><div class="sk"></div>${l.id === 'waiting' || l.id === 'changes' ? '<div class="sk"></div>' : ''}</div>`; continue; }
      const cards = row.prs.filter((p) => p.lane === l.id).sort(sortCards);
      html += `<div class="cell">${cards.length ? cards.map(cardHTML).join('') : `<div class="cell-empty">${emptyText(l.id, row.id)}</div>`}</div>`;
    }
  }
  return html + '</div></div>';
}

function emptyText(lane, row) {
  const mine = row === 'mine';
  return {
    draft: 'No drafts',
    waiting: mine ? 'Nothing waiting for a first review' : 'No new review requests',
    changes: mine ? 'No feedback to address' : 'Nothing waiting on authors',
    updated: mine ? 'Nothing waiting on re-review' : 'No updates to re-review',
    approved: 'Nothing ready to merge',
    done: `Nothing closed in the last ${settings.doneDays || 7} days`,
  }[lane] || 'Nothing here';
}

function renderRail() {
  const rail = $('#rail');
  rail.hidden = false;
  if (!state.prs.length && state.loading) { rail.innerHTML = '<div class="rail-head"><span class="move-n zero">–</span><span class="move-l" id="railTitle">Checking your clock…</span></div>'; return; }
  const mine = state.prs.filter((p) => p.turn === 'me').sort((a, b) => a.since - b.since);
  const others = state.prs.filter((p) => isOpen(p) && p.lane !== 'draft' && p.turn !== 'me').length;
  if (!mine.length) {
    rail.innerHTML = `<div class="rail-head"><span class="move-n zero num">0</span><span class="move-l" id="railTitle">Nothing on your clock</span>
      <span class="move-sub">${others ? `${others} PR${others > 1 ? 's are' : ' is'} waiting on someone else.` : ''}</span></div>`;
    return;
  }
  const limit = showAllTiles ? mine.length : 6;
  const tiles = mine.slice(0, limit).map((p) => {
    const lvl = staleLevel(waitOf(p));
    return `<button class="tile" data-id="${esc(p.id)}" aria-current="${p.id === selectedId}">
      <span class="tile-main"><span class="ref">${esc(p.repo)} #${p.number}</span><span class="tile-title" title="${esc(p.title)}">${esc(p.title)}</span><span class="verb">${verbFor(p)}</span></span>
      <span class="tile-clock ${lvl === 'danger' ? 'danger' : ''}" title="Waiting on you for ${fmtDur(waitOf(p))}">${lvl === 'danger' ? ic('flag', 'sm') : ''}${fmtClock(waitOf(p))}</span>
    </button>`;
  }).join('');
  const more = mine.length > limit ? `<button class="tile-more" data-act="more">Show ${mine.length - limit} more</button>` : '';
  rail.innerHTML = `<div class="rail-head"><span class="move-n num">${mine.length}</span><span class="move-l" id="railTitle">${mine.length === 1 ? 'PR is' : 'PRs are'} on your clock</span>
    <span class="move-sub">Longest wait ${fmtDur(waitOf(mine[0]))}</span></div><div class="tiles">${tiles}${more}</div>`;
}

function renderToolbar() {
  const all = state.prs;
  const open = all.filter(isOpen);
  $('#nAll').textContent = open.length || '';
  $('#nMine').textContent = open.filter((p) => p.isMine).length || '';
  $('#nReview').textContent = open.filter((p) => !p.isMine).length || '';
  $('#nFlag').textContent = all.filter(isFlagged).length || '';
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.role === ui.role)));
  $('#fFlag').setAttribute('aria-pressed', String(!!ui.flagged));
  const repos = [...new Set(all.map((p) => p.repo))].sort();
  $('#fRepo').innerHTML = '<option value="">All repositories</option>' + repos.map((r) => `<option ${r === ui.repo ? 'selected' : ''}>${esc(r)}</option>`).join('');
  $('#fSwim').checked = ui.swim;
  if ($('#fQ') !== document.activeElement) $('#fQ').value = ui.q;
}

function renderHeader() {
  const me = state.me;
  $('#me').innerHTML = me ? `<span>${esc(me.login)}</span>${avatarImg(me.avatarUrl, me.login, 'avatar')}` : '';
  $('#demoPill').innerHTML = state.demo ? '<span class="demo-pill">Demo data</span>' : '';
  let s = '';
  if (state.loading) s = 'Updating…';
  else if (state.fetchedAt) s = `Updated ${new Date(state.fetchedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
  if (state.rate && !state.loading) s += ` · ${state.rate.remaining} API calls left`;
  $('#status').textContent = s;
  $('#btnRefresh').classList.toggle('spinning', state.loading);
  const turns = state.prs.filter((p) => p.turn === 'me').length;
  document.title = turns ? `(${turns}) PR Monitor` : 'PR Monitor';
}

function renderNotices() {
  const n = [];
  if (state.error) n.push(`<div class="notice" role="alert">${ic('alert')}<span>${esc(state.error)}</span></div>`);
  if (state.warnings.length) {
    const sso = state.warnings.some((w) => /SAML|SSO/i.test(w));
    n.push(`<div class="notice warn">${ic('alert')}<span>Some results could not be loaded: ${esc(state.warnings.slice(0, 2).join('; '))}${sso ? '. Open your token on GitHub and use Configure SSO to authorize the organization.' : ''}</span></div>`);
  }
  if (state.demo) n.push(`<div class="notice warn">${ic('alert')}<span>You are looking at demo data. <a href="#" data-act="settings">Add a token</a> to load your pull requests.</span></div>`);
  $('#notices').innerHTML = n.join('');
}

/* ---------- Inspector ---------- */

function showDetail(id) {
  selectedId = id;
  render();
  $('#inspector').focus({ preventScroll: true });
}
function closeDetail() {
  if (!selectedId) return;
  const id = selectedId;
  selectedId = null;
  render();
  document.querySelector(`.card[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
}

function renderInspector() {
  const el = $('#inspector');
  const p = selectedId && state.prs.find((x) => x.id === selectedId);
  document.body.classList.toggle('inspecting', !!p);
  el.classList.toggle('open', !!p);
  if (!p) { el.innerHTML = ''; return; }
  const lane = LANES.find((l) => l.id === p.lane);
  const unresolved = p.threads.filter((t) => !t.resolved).sort((a, b) => a.createdAt - b.createdAt);
  const when = (t) => (t ? `<time title="${esc(fmtDate(t))}">${ago(t)}</time>` : '—');
  const facts = [
    ['Status', `${lane.title} · ${esc(turnSentence(p))}`],
    ['Opened', when(p.createdAt)],
    ['Last push', when(p.lastPushAt)],
    ['Last feedback', p.lastFeedbackAt ? when(p.lastFeedbackAt) : 'None yet'],
    ['Threads', p.threads.length ? `${p.threads.length - unresolved.length} of ${p.threads.length} resolved${p.awaitingAuthor ? ` · ${p.awaitingAuthor} waiting on @${esc(p.author)}` : ''}${p.authorReplied ? ` · ${p.authorReplied} answered, waiting on reviewer` : ''}` : 'No review threads'],
    ['Comments', `${p.comments} on the conversation`],
    ['Branch', `<code>${esc(p.head)}</code> → <code>${esc(p.base)}</code>`],
    ['Size', `<span class="num"><span class="add">+${p.additions}</span> <span class="del">−${p.deletions}</span></span> · ${p.changedFiles} files · ${p.commits} commits`],
    ['Checks', `${p.ci ? (CI[p.ci]?.[2] || p.ci) : 'No checks'}${p.mergeable === 'CONFLICTING' && isOpen(p) ? ' · <span class="bad">merge conflict</span>' : ''}`],
  ];
  if (p.lane === 'done') facts.splice(1, 0, [p.state === 'MERGED' ? 'Merged' : 'Closed', `${when(p.closedAt)}, ${fmtDur(p.closedAt - p.createdAt)} after opening`]);

  const reviewers = p.reviewers.map((r) => {
    const s = r.state ? `<span class="state-line">${ic(STATE_ICON[r.state], 'sm')}${STATE_TEXT[r.state]} ${ago(r.lastAt)}</span>` : '<span>Has not reviewed</span>';
    const req = r.pending ? `<span class="pill on-reviewer">${ic('hourglass', 'sm')}${r.state ? 'Re-review requested' : 'Review requested'}</span>` : '';
    return `<li>${avatarImg(r.avatar, r.login)}<div class="grow"><span><b>${esc(r.login)}</b>${r.bot ? ' <span class="pill">bot</span>' : ''}</span><span class="sub">${s}${req}</span></div></li>`;
  }).concat(p.teams.map((t) => `<li>${ic('team', 'lg')}<div class="grow"><b>@${esc(t)}</b><span class="sub"><span class="pill on-reviewer">${ic('hourglass', 'sm')}Team review requested</span></span></div></li>`));

  const threads = unresolved.map((t) => {
    const onAuthor = !eq(t.lastBy, p.author);
    const tag = onAuthor
      ? `<span class="pill on-author">${ic('hourglass', 'sm')}Waiting on @${esc(p.author)}</span>`
      : `<span class="pill on-reviewer">${ic('reply', 'sm')}@${esc(p.author)} replied</span>`;
    return `<li>${avatarImg(t.starterAvatar, t.starter)}<div class="grow">
      <span class="sub"><b style="color:var(--text)">${esc(t.starter || 'unknown')}</b>${t.path ? `<code>${esc(t.path)}</code>` : ''}${t.outdated ? '<span class="pill">outdated</span>' : ''}${t.starterBot ? '<span class="pill">bot</span>' : ''}</span>
      <span class="body">${esc(t.body)}</span>
      <span class="sub">${tag}<span>${t.count} message${t.count === 1 ? '' : 's'}, last ${ago(t.lastAt)}</span>${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">Open</a>` : ''}</span>
    </div></li>`;
  });

  el.innerHTML = `<div class="insp-head">
      <div class="insp-top"><span>${esc(p.repo)} #${p.number} · @${esc(p.author)}</span>
        <button class="btn ghost icon" data-act="close" aria-label="Close details">${ic('x')}</button></div>
      <h2 class="insp-title"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
      ${clockHTML(p, 'lg')}
      <div><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener" style="text-decoration:none">${ic('external', 'sm')}Open on GitHub</a></div>
    </div>
    <div class="insp-body">
      <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      <section><h4>Reviewers <span class="num">${p.reviewers.length + p.teams.length || ''}</span></h4>${reviewers.length ? `<ul class="list">${reviewers.join('')}</ul>` : '<p class="none">No reviewers requested yet.</p>'}</section>
      <section><h4>Unresolved threads <span class="num">${unresolved.length || ''}</span></h4>${threads.length ? `<ul class="list">${threads.join('')}</ul>` : '<p class="none">Every review thread is resolved.</p>'}</section>
    </div>`;
}

/* ---------- Load / refresh ---------- */

async function refresh() {
  if (state.loading) return;
  if (state.demo) { loadDemo(); return; }
  if (!settings.token) { render(); return; }
  state.loading = true; state.error = null; state.warnings = [];
  render();
  try {
    const items = await fetchFromGitHub();
    state.prs = items.map(({ node, src }) => analyze(node, state.me.login, src));
    state.fetchedAt = Date.now();
    maybeNotify();
  } catch (e) {
    state.error = e.message || String(e);
  } finally {
    state.loading = false;
    render();
  }
}

function maybeNotify() {
  const ids = new Set(state.prs.filter((p) => p.turn === 'me').map((p) => p.id));
  if (knownTurnIds && settings.notify && 'Notification' in window && Notification.permission === 'granted') {
    const fresh = state.prs.filter((p) => ids.has(p.id) && !knownTurnIds.has(p.id));
    for (const p of fresh.slice(0, 5)) {
      const n = new Notification(`Your move: ${p.repo} #${p.number}`, { body: `${p.title}\n${p.hint}`, tag: p.id });
      n.onclick = () => { window.focus(); showDetail(p.id); };
    }
  }
  knownTurnIds = ids;
}

function scheduleRefresh() {
  clearInterval(refreshTimer);
  if (settings.refreshMin > 0) refreshTimer = setInterval(() => { if (!document.hidden) refresh(); }, settings.refreshMin * 60e3);
}

/* ---------- Demo data ---------- */

  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* ---------- Settings ---------- */

function openSettings() {
  const f = $('#settingsForm');
  for (const [k, v] of Object.entries(settings)) {
    const el = f.elements[k];
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  }
  $('#dlgSettings').showModal();
}
$('#dlgSettings').addEventListener('close', () => {
  if ($('#dlgSettings').returnValue !== 'save') return;
  const f = $('#settingsForm');
  const next = { ...settings };
  for (const k of Object.keys(DEFAULTS)) {
    const el = f.elements[k];
    if (!el) continue;
    if (el.type === 'checkbox') next[k] = el.checked;
    else if (el.type === 'number') next[k] = Math.max(0, Number(el.value) || 0);
    else next[k] = el.value.trim();
  }
  const tokenChanged = next.token !== settings.token;
  settings = next;
  store.set(SETTINGS_KEY, settings);
  if (settings.notify && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  if (tokenChanged) { state.me = null; state.prs = []; knownTurnIds = null; }
  if (settings.token) state.demo = false;
  scheduleRefresh();
  state.demo ? loadDemo() : refresh();
});
$('#btnClearToken').addEventListener('click', () => {
  $('#settingsForm').elements.token.value = '';
});

/* ---------- Events ---------- */

function saveUI() { store.set(UI_KEY, { role: ui.role, repo: ui.repo, swim: ui.swim, flagged: ui.flagged }); }
$('#btnRefresh').addEventListener('click', refresh);
$('#btnSettings').addEventListener('click', openSettings);
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { ui.role = b.dataset.role; saveUI(); render(); }));
$('#fFlag').addEventListener('click', () => { ui.flagged = !ui.flagged; saveUI(); render(); });
$('#fRepo').addEventListener('change', (e) => { ui.repo = e.target.value; saveUI(); render(); });
$('#fSwim').addEventListener('change', (e) => { ui.swim = e.target.checked; saveUI(); render(); });
$('#fQ').addEventListener('input', (e) => { ui.q = e.target.value; render(); });
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act) e.preventDefault();
  if (act === 'settings') return openSettings();
  if (act === 'demo') return loadDemo();
  if (act === 'close') return closeDetail();
  if (act === 'more') { showAllTiles = true; return render(); }
  if (e.target.closest('a')) return;
  const item = e.target.closest('.card, .tile');
  if (item) return item.dataset.id === selectedId && item.classList.contains('card') ? closeDetail() : showDetail(item.dataset.id);
});
document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;
  if (e.key === 'Escape' && selectedId) { e.preventDefault(); return closeDetail(); }
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'Enter' && e.target.classList?.contains('card')) showDetail(e.target.dataset.id);
  if (e.key === '/' ) { e.preventDefault(); $('#fQ').focus(); }
  if (e.key === 'r' && !e.metaKey && !e.ctrlKey) refresh();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && settings.token && !state.demo && state.fetchedAt && settings.refreshMin > 0
      && Date.now() - state.fetchedAt > settings.refreshMin * 60e3) refresh();
});
setInterval(() => { if (state.prs.length && !document.querySelector('dialog[open]')) render(); }, 60e3); // keep clocks fresh

/* ---------- Start ---------- */

if (new URLSearchParams(location.search).has('demo')) loadDemo();
else { render(); refresh(); }
scheduleRefresh();
</script>
